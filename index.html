    <style>
      /* Loading screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: 'Roboto', sans-serif;
      }

      #loading-screen h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        animation: fadeIn 1s ease-in;
      }

      #loading-screen .loading-dots {
        display: flex;
        gap: 0.5rem;
        margin-top: 2rem;
      }

      #loading-screen .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: white;
        animation: bounce 1.4s infinite ease-in-out both;
      }

      #loading-screen .dot:nth-child(1) { animation-delay: -0.32s; }
      #loading-screen .dot:nth-child(2) { animation-delay: -0.16s; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 2rem auto;
      }

      /* Hide loading screen when app loads */
      .loaded #loading-screen {
        display: none;
      }

      /* Base styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica', 'Arial', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #fafafa;
        color: #333;
        line-height: 1.6;
      }

      /* Responsive typography */
      @media (max-width: 768px) {
        #loading-screen h1 {
          font-size: 2rem;
        }
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121212;
          color: #ffffff;
        }
      }

      /* High contrast mode */
      @media (prefers-contrast: high) {
        #loading-screen {
          background: #000;
          color: #fff;
        }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        #loading-screen .loading-dots,
        .loading-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Roboto', sans-serif;
        color: #333;
        text-align: center;
        padding: 2rem;
      ">
        <div>
          <h2>需要启用 JavaScript</h2>
          <p>English Learning 应用需要 JavaScript 才能正常运行。</p>
          <p>请在浏览器设置中启用 JavaScript 后刷新页面。</p>
        </div>
      </div>
    </noscript>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <h1>📚 English Learning</h1>
      <p>AI 驱动的英语学习助手</p>
      <div class="loading-spinner"></div>
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Remove loading screen when app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.body.classList.add('loaded');
        }, 500);
      });

      // Error handling for loading failures
      window.addEventListener('error', function(e) {
        console.error('Application loading error:', e);
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.innerHTML = `
            <h1>⚠️ 加载失败</h1>
            <p>应用加载时出现错误</p>
            <button onclick="window.location.reload()" style="
              background: white;
              color: #667eea;
              border: none;
              padding: 12px 24px;
              border-radius: 6px;
              font-size: 16px;
              cursor: pointer;
              margin-top: 20px;
            ">重试</button>
          `;
        }
      });

      // Service Worker registration for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('SW registered: ', registration);
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }

      // Performance monitoring
      if ('performance' in window) {
        window.addEventListener('load', function() {
          setTimeout(function() {
            var perfData = window.performance.timing;
            var pageLoadTime = perfData.loadEventEnd - perfData.navigationStart;
            console.log('Page load time:', pageLoadTime + 'ms');
          }, 0);
        });
      }

      // Detect browser capabilities
      const capabilities = {
        speechRecognition: 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window,
        speechSynthesis: 'speechSynthesis' in window,
        webAssembly: 'WebAssembly' in window,
        localStorage: 'localStorage' in window,
        serviceWorker: 'serviceWorker' in navigator
      };

      console.log('Browser capabilities:', capabilities);

      // Store capabilities for later use
      try {
        localStorage.setItem('browserCapabilities', JSON.stringify(capabilities));
      } catch (e) {
        console.warn('Could not store browser capabilities:', e);
      }
    </script>
      <script type="module" src="/src/index.js"></script>
  </body>
</html>
